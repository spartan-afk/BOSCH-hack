# Allowed namespaces for chaos injection
namespaces:
  - fleet
  - boutique

# Allowed services for chaos injection
services:
  - telematics-ingest
  - alert-engine
  - tracking-service
  - dtc-analyzer
  - vehicle-manager
  - telematics-simulator
  - gps-tracker
  - frontend
  - checkoutservice
  - cartservice
  - paymentservice
  - shippingservice
  - currencyservice
  - productcatalogservice
  - recommendationservice
  - adservice
  - emailservice
  - redis-cart

# Forbidden services (never target these)
forbidden:
  - kube-system
  - kube-dns
  - coredns

# Cluster context pattern (must match)
cluster_context_pattern: "kind-*"
