services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    labels:
      - "com.docker.compose.project=bosch-hack"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/fleet/status"]
      interval: 5s
      timeout: 3s
      retries: 5
